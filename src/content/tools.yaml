# "What I've worked with" on Home: one entry per language, framework, tool, or
# service Ross has used (his list, 2026-10-03). Shown in `order` as the
# official full-color logo with the name under it; marks that are black in the
# original use the brand's white version so they read on the dark ground.
# Logos live in logos/ (SVG). Sources (2026-10-03): the brand's own site or
# press kit where it publishes one (TypeScript, PostgreSQL, R, Astro, Tailwind
# CSS, CSS, Node.js, Git, IntelliJ IDEA, Google Antigravity, Cursor, Supabase);
# otherwise Devicon (Java, Python, React, Visual Studio Code, Vim, RStudio),
# Simple Icons in the brand color (Next.js, Roblox Studio, Claude Code,
# Vercel), or LobeHub Icons (OpenAI Codex).
